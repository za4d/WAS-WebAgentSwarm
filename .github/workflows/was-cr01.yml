name: WAS CR-01 — content/background physical Send offline

on:
  push:
    branches: [fix/cr01-content-background-20261123, fix/cr01-durable-receipts-20261123, fix/cr01-audit-boundaries-20261123, fix/cr01-codeql-token-atomic-20261123, fix/cr01-r01-r05-relay-authority-20261123]
    paths:
      - 'browser-extension/**'
      - 'tests/relay-evaluation/**'
      - 'tests/test_swarm.py'
      - 'tests/test_bridge.py'
      - 'tests/test_cr04_effectful_retry.py'
      - 'src/web_agent_swarm/swarm.py'
      - 'bridge/**'
      - '.github/workflows/was-cr01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-five-source-cases:
    name: Original CR-01 five-case oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run exact checkout original five negative cases
        shell: bash
        run: |
          set +e
          node tests/relay-evaluation/send-safety.cjs > "$RUNNER_TEMP/cr01-original-five.json" 2> "$RUNNER_TEMP/cr01-original-five.stderr"
          code=$?
          set -e
          cat "$RUNNER_TEMP/cr01-original-five.json"
          cat "$RUNNER_TEMP/cr01-original-five.stderr" >&2
          printf 'source_sha=%s\nnode_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/cr01-original-five-receipt.txt"
          cat "$RUNNER_TEMP/cr01-original-five-receipt.txt"
          exit "$code"
      - name: Preserve original source-level receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr01-original-five-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cr01-original-five.json
            ${{ runner.temp }}/cr01-original-five.stderr
            ${{ runner.temp }}/cr01-original-five-receipt.txt
          retention-days: 30

  full-extension-source:
    name: Whole-script VM synthetic Chrome and restart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run whole content and background script fault suite
        shell: bash
        run: |
          set +e
          node tests/relay-evaluation/cr01-full-script.cjs > "$RUNNER_TEMP/cr01-full.json" 2> "$RUNNER_TEMP/cr01-full.stderr"
          code=$?
          set -e
          cat "$RUNNER_TEMP/cr01-full.json"
          cat "$RUNNER_TEMP/cr01-full.stderr" >&2
          printf 'source_sha=%s\nnode_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/cr01-full-receipt.txt"
          cat "$RUNNER_TEMP/cr01-full-receipt.txt"
          exit "$code"
      - name: Preserve whole-script negative and positive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr01-full-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cr01-full.json
            ${{ runner.temp }}/cr01-full.stderr
            ${{ runner.temp }}/cr01-full-receipt.txt
          retention-days: 30

  actual-bridge-loopback:
    name: Real loopback bridge, fake extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci
      - name: Test real localhost server with fake extension
        shell: bash
        run: |
          set +e
          node tests/relay-evaluation/cr01-bridge-transport.cjs > "$RUNNER_TEMP/cr01-bridge.json" 2> "$RUNNER_TEMP/cr01-bridge.stderr"
          code=$?
          set -e
          cat "$RUNNER_TEMP/cr01-bridge.json"
          cat "$RUNNER_TEMP/cr01-bridge.stderr" >&2
          printf 'source_revision=%s\nbridge_test_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/cr01-bridge-receipt.txt"
          cat "$RUNNER_TEMP/cr01-bridge-receipt.txt"
          exit "$code"
      - name: Preserve bridge HTTP and WS transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr01-bridge-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cr01-bridge.json
            ${{ runner.temp }}/cr01-bridge.stderr
            ${{ runner.temp }}/cr01-bridge-receipt.txt
          retention-days: 30

  real-r8-authority:
    name: R8 signed-permit bridge safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci
      - name: Prove direct bearer denial, valid permit and crash/replay fences
        shell: bash
        run: |
          set +e
          node tests/relay-evaluation/cr01-r01-permit-bridge.cjs > "$RUNNER_TEMP/cr01-r01.json" 2> "$RUNNER_TEMP/cr01-r01.stderr"
          code=$?
          set -e
          cat "$RUNNER_TEMP/cr01-r01.json"
          cat "$RUNNER_TEMP/cr01-r01.stderr" >&2
          printf 'source_revision=%s\nr01_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/cr01-r01-receipt.txt"
          cat "$RUNNER_TEMP/cr01-r01-receipt.txt"
          exit "$code"
      - name: Preserve signed-permit source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cr01-r01-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cr01-r01.json
            ${{ runner.temp }}/cr01-r01.stderr
            ${{ runner.temp }}/cr01-r01-receipt.txt
          retention-days: 30

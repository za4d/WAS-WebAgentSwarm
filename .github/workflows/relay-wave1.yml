name: WAS Relay Wave 1 - offline checks

on:
  push:
    branches:
      - integration/relay-safety-20261123
    paths:
      - 'tests/relay-evaluation/**'
      - 'tests/test_wave1_management.py'
      - 'browser-extension/**'
      - 'src/web_agent_swarm/**'
      - '.github/workflows/relay-wave1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-safety:
    name: Browser Send safety (expected red at baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run actual checkout Send regression runner
        shell: bash
        run: |
          set +e
          node tests/relay-evaluation/send-safety.cjs > "$RUNNER_TEMP/send-safety.json" 2> "$RUNNER_TEMP/send-safety.stderr"
          code=$?
          set -e
          cat "$RUNNER_TEMP/send-safety.json"
          cat "$RUNNER_TEMP/send-safety.stderr" >&2
          printf 'source_revision=%s\nnode_runner_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/send-safety-provenance.txt"
          cat "$RUNNER_TEMP/send-safety-provenance.txt"
          # A known-red baseline is a PRODUCT FAILURE, so preserve failing status.
          exit "$code"
      - name: Preserve original test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-send-safety-${{ github.sha }}
          path: |
            ${{ runner.temp }}/send-safety.json
            ${{ runner.temp }}/send-safety.stderr
            ${{ runner.temp }}/send-safety-provenance.txt
          if-no-files-found: warn
          retention-days: 30

  task-management:
    name: Real WAS DurableStore management contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run isolated task dependency, lease and competing-writer checks
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_wave1_management.py' -v > "$RUNNER_TEMP/task-management.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/task-management.log"
          printf 'source_revision=%s\npython_test_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/coordination-provenance.txt"
          cat "$RUNNER_TEMP/coordination-provenance.txt"
          exit "$code"
      - name: Preserve original task test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-task-management-${{ github.sha }}
          path: |
            ${{ runner.temp }}/task-management.log
            ${{ runner.temp }}/coordination-provenance.txt
          if-no-files-found: warn
          retention-days: 30

  aged-live-lock:
    name: Live-writer lock after stale timestamp (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run actual store's isolated stale-lock fault
        shell: bash
        run: |
          set +e
          python tests/relay-evaluation/lock-age-fault.py > "$RUNNER_TEMP/lock-fault.json" 2> "$RUNNER_TEMP/lock-fault.stderr"
          code=$?
          set -e
          cat "$RUNNER_TEMP/lock-fault.json"
          cat "$RUNNER_TEMP/lock-fault.stderr" >&2
          printf 'source_revision=%s\npython_runner_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/lock-fault-provenance.txt"
          cat "$RUNNER_TEMP/lock-fault-provenance.txt"
          exit "$code"
      - name: Preserve negative-case proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-lock-fault-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lock-fault.json
            ${{ runner.temp }}/lock-fault.stderr
            ${{ runner.temp }}/lock-fault-provenance.txt
          if-no-files-found: warn
          retention-days: 30

  compare-os-lock:
    name: Pinned candidate lock negative case (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact published candidate revision in isolated checkout
        uses: actions/checkout@v4
        with:
          repository: MrWrecks/WAS-WebAgentSwarm
          ref: 7f96d4288cbfbed4188ae0f13d8334dd81b7833a
          path: .compare-mrwrecks
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run identical aged-live-writer fault on candidate
        shell: bash
        env:
          WAS_WAVE1_SOURCE_ROOT: .compare-mrwrecks
        run: |
          set +e
          python tests/relay-evaluation/lock-age-fault.py > "$RUNNER_TEMP/compare-lock.json" 2> "$RUNNER_TEMP/compare-lock.stderr"
          code=$?
          set -e
          cat "$RUNNER_TEMP/compare-lock.json"
          cat "$RUNNER_TEMP/compare-lock.stderr" >&2
          printf 'source_revision=%s\ncandidate_revision=7f96d4288cbfbed4188ae0f13d8334dd81b7833a\nrunner_exit=%s\n' "$GITHUB_SHA" "$code" > "$RUNNER_TEMP/compare-lock-provenance.txt"
          cat "$RUNNER_TEMP/compare-lock-provenance.txt"
          exit "$code"
      - name: Save exact candidate comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave1-compare-lock-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compare-lock.json
            ${{ runner.temp }}/compare-lock.stderr
            ${{ runner.temp }}/compare-lock-provenance.txt
          if-no-files-found: warn
          retention-days: 30
